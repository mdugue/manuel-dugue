name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Reads the version from "packageManager" in package.json, the same
          # Bun that Vercel runs (bunVersion in vercel.json).
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Generate .next/types (typed routes) without a full build, so the
      # typecheck and the type-aware lint rules can run first and fail fast.
      - name: Generate route types
        run: bun --bun next typegen

      - name: Typecheck (bun check)
        run: bun run typecheck

      - name: Lint (oxlint + oxfmt)
        run: bun run lint

      - name: Build
        run: bun run build
