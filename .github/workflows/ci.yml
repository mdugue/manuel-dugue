name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 26 is the project's Node version (.nvmrc). Vercel builds and
        # Functions still run 24.x until it offers 26, so keep that covered.
        node: [26, 24]
    name: check (node ${{ matrix.node }})
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Generate .next/types (typed routes) without a full build, so the
      # typecheck and the type-aware lint rules can run first and fail fast.
      - name: Generate route types
        run: npx next typegen

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # `bun check` needs Bun 1.4.3 or newer.
          bun-version: latest

      - name: Typecheck (bun check)
        run: npm run typecheck

      - name: Lint (oxlint + oxfmt)
        run: npm run lint

      - name: Build
        run: npm run build
