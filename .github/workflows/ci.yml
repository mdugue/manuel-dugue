name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 26 is the project's Node version (.nvmrc). Vercel builds and
        # Functions still run 24.x until it offers 26, so keep that covered.
        node: [26, 24]
    name: check (node ${{ matrix.node }})
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Build first: it generates .next/types (typed routes), which the
      # type-aware lint rules and the typecheck rely on.
      - name: Build
        run: npm run build

      - name: Lint (oxlint + oxfmt)
        run: npm run lint

      - name: Typecheck
        run: npm run tsc
